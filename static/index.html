<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8faf8">
    <title>ClaimBack — get your claim back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light; font-family: "DM Sans", sans-serif; background: #f8faf8; color: #16241d; }
      body { margin: 0; min-height: 100vh; background: #f8faf8; }
      h1,h2,h3,.brand { font-family: "Manrope", sans-serif; }
      button, input, textarea { font: inherit; }
      .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
      .soft-shadow { box-shadow: 0 18px 50px rgba(24, 61, 43, .08); }
      .loader { width: 20px; height: 20px; border: 2px solid #d7e4dc; border-top-color: #176342; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .step-dot { width: 9px; height: 9px; border-radius: 99px; background: #18815a; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
